<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Login - Patient Wellness System</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <h2>Hospital Staff Login</h2>
            <p class="subtitle">Access the hospital management portal</p>

            <div id="alert-container"></div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-input" placeholder="Enter your staff email" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-input" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>

            <div class="auth-footer">
                <p><a href="../index.html">← Back to Home</a></p>
            </div>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);

            const result = await apiRequest('login', data);

            if (result.success && result.data.role === 'staff') {
                window.location.href = 'dashboard.html';
            } else if (result.success) {
                showAlert('Please use the hospital login page.', 'warning', document.getElementById('alert-container'));
            } else {
                showAlert(result.message, 'danger', document.getElementById('alert-container'));
            }
        });
    </script>
</body>
</html>
